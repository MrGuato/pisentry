name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # stdlib only, nothing to cache
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          install-go: false
      - name: test
        run: go test -race ./...
      - name: cross-compile
        run: make dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # Known vulnerabilities in the Go standard library are the only dependency
  # risk this project has. Fail the build when the toolchain has one.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          go-package: ./...

  # Native ARM runner: proves the procfs parsing and detectors on real arm64.
  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test ./...

  # The alert rules are part of the product: an alert that never fires is
  # worse than none. promtool checks syntax and runs the rule unit tests;
  # kubeconform checks every manifest, the PrometheusRule against its CRD
  # schema (kubectl --dry-run=client cannot, it fails without the CRD).
  alert-rules:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool check rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/r:ro" -w /r "$PROMETHEUS_IMAGE" check rules pisentry-rules.yaml
      - name: promtool test rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/r:ro" -w /r "$PROMETHEUS_IMAGE" test rules pisentry-rules.test.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: kubeconform
        run: >-
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          -strict -summary
          -ignore-filename-pattern 'kustomization.yaml'
          -ignore-filename-pattern '\.example$'
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          deploy/kubernetes/
