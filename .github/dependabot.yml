version: 2
updates:
  # Actions are pinned by commit SHA. Dependabot moves the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
    # One PR per week for all actions. main requires branches to be up to date,
    # so separate PRs each go stale the moment another one merges.
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile are pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
